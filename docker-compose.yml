services:
  shovly-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shovly-ai-platform
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/data
      - APP_ENV=production
    volumes:
      - shovly_sqlite_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  shovly_sqlite_data:
    name: shovly_sqlite_data